defaults:
  - base
  - machine: ???
  - _self_

# How many scenes of the DL3DV test split to report on, null for all
num_scenes: null

# Every scene is a window of 2 * max(context_views) contiguous frames,
# alternating context and test frames; a view count k uses the first
# 2k of them
context_views: [3, 6, 16, 32, 48, 64]
gaussian_budgets: [50_000, 100_000, 250_000, 500_000]
generators: [YoNoSplat, AnySplat]

# How a budget picks the Gaussians it keeps
rules:
  uniform:
    score: uniform
    selection: random
  radsplat:
    score: radsplat
    selection: weighted
    temperature: 2.0
  mini-splatting:
    score: mini-splatting
    selection: weighted
    temperature: 1.0
batches_per_pass: 32

# What is scored at every budget. No rule is the whole field; a
# checkpoint is the SplatFormer that refines the pruned field, and a
# method whose checkpoint is not on this machine is skipped.
methods:
  - name: full field
  - name: uniform
    rule: uniform
  - name: RadSplat
    rule: radsplat
  - name: Mini-Splatting
    rule: mini-splatting
  - name: uniform + compensation
    rule: uniform
    compensate: true
  - name: RadSplat + compensation
    rule: radsplat
    compensate: true
  - name: Mini-Splatting + compensation
    rule: mini-splatting
    compensate: true
  - name: uniform + SplatFormer
    rule: uniform
    checkpoint: ${checkpoints_dir}/anyprune/uniform.pth
  - name: uniform + compensation + SplatFormer
    rule: uniform
    compensate: true
    checkpoint: ${checkpoints_dir}/anyprune/uniform-compensated.pth
  - name: RadSplat + SplatFormer
    rule: radsplat
    checkpoint: ${checkpoints_dir}/anyprune/radsplat.pth
  - name: RadSplat + compensation + SplatFormer
    rule: radsplat
    compensate: true
    checkpoint: ${checkpoints_dir}/anyprune/radsplat-compensated.pth
  - name: Mini-Splatting + SplatFormer
    rule: mini-splatting
    checkpoint: ${checkpoints_dir}/anyprune/mini-splatting.pth
  - name: Mini-Splatting + compensation + SplatFormer
    rule: mini-splatting
    compensate: true
    checkpoint: ${checkpoints_dir}/anyprune/mini-splatting-compensated.pth

refiner:
  # Normalize every field by its own statistics rather than by the
  # running averages of training
  batch_statistics: true

output_dir: ${outputs_dir}/eval

# Ask for reproducible cudnn and cublas kernels.
deterministic: false
